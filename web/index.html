<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>ConnectAR</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <header>
    <h1>ConnectAR</h1>
    <select id="board" aria-label="Материнская плата"></select>
    <nav role="tablist" aria-label="Разделы">
      <button type="button" role="tab" data-tab="assembly" aria-selected="true">Сборка</button>
      <button type="button" role="tab" data-tab="camera" aria-selected="false">Камера</button>
    </nav>
  </header>

  <main>
    <section id="tab-assembly" role="tabpanel">
      <section id="setup" class="card" aria-labelledby="setup-title">
        <div class="setup-head">
          <h2 id="setup-title">Ваша сборка</h2>
          <button id="setup-edit" type="button" hidden>Изменить</button>
        </div>
        <p id="setup-intro" class="muted">Ответьте на несколько вопросов — чек-лист и подсветка на плате подстроятся под ваши комплектующие.</p>
        <p id="setup-summary" class="muted" hidden></p>
        <form id="setup-form">
          <div id="setup-questions"></div>
          <button id="setup-done" type="submit" class="primary">Готово</button>
        </form>
      </section>

      <div id="checklist" hidden>
        <h2>Шаги сборки</h2>
        <p id="progress"></p>
        <div id="phases"></div>
        <button id="reset" type="button">Сбросить прогресс</button>
      </div>
    </section>

    <section id="tab-camera" role="tabpanel" hidden>
      <div id="camera-viewport">
        <div id="ar-view"></div>
        <div id="ar-labels" class="labels-layer"></div>
        <div id="photo-view" hidden></div>

        <div id="camera-loading" class="overlay" hidden>
          <p id="camera-loading-text"></p>
          <progress id="camera-progress" max="1"></progress>
        </div>

        <div id="camera-hint" class="hint" hidden>
          <p id="camera-hint-text"></p>
          <p id="camera-tips" hidden>
            Включите свет поярче, держите телефон в 30–60 см от платы, плата должна целиком попасть в кадр.
            Поддерживается <span id="camera-tips-board"></span>.
          </p>
        </div>

        <div id="camera-notice" class="overlay" hidden>
          <p id="camera-notice-text"></p>
          <button id="camera-retry" type="button" hidden></button>
        </div>

        <p id="frozen-note" class="hint" hidden></p>
      </div>

      <button id="current-step" type="button" class="current-step" hidden>
        <span class="badge">Сейчас</span>
        <strong id="current-step-title"></strong>
        <span id="current-step-note" class="muted">— этот шаг без разметки на плате</span>
      </button>

      <div id="place-bar" hidden>
        <svg id="place-schema" viewBox="0 0 100 100" aria-hidden="true"></svg>
        <div>
          <p id="place-hint" aria-live="polite"></p>
          <div class="place-actions">
            <button id="corners-restart" type="button">Заново</button>
            <button id="corners-done" type="button" class="primary">Готово</button>
          </div>
        </div>
      </div>

      <div class="toolbar">
        <button id="freeze" type="button" class="primary">Заморозить</button>
        <button id="torch" type="button" aria-pressed="false" hidden>Фонарик</button>
        <button id="to-photo" type="button">Режим фото</button>
        <button id="back-to-ar" type="button" class="primary">Вернуться в AR</button>
        <button id="take-photo" type="button" class="primary">Сделать фото</button>
        <button id="pick-photo" type="button">Выбрать из галереи</button>
        <button id="fix-corners" type="button" hidden>Поправить углы</button>
      </div>
      <input id="file-capture" type="file" accept="image/*" capture="environment" hidden>
      <input id="file-gallery" type="file" accept="image/*" hidden>
    </section>

    <p id="error" role="alert" hidden></p>
  </main>

  <dialog id="step-dialog" aria-labelledby="dialog-title">
    <p id="dialog-badge" class="badge" hidden>Текущий шаг</p>
    <h2 id="dialog-title"></h2>
    <p id="dialog-connector" class="muted"></p>
    <p id="dialog-instruction"></p>
    <ol id="dialog-substeps"></ol>
    <p id="dialog-warning" class="warning" hidden></p>
    <div id="dialog-cables"></div>
    <a id="dialog-manual" target="_blank" rel="noopener"></a>
    <p id="dialog-locked" class="locked-note" hidden></p>
    <div class="toolbar">
      <button id="dialog-toggle" type="button"></button>
      <button id="dialog-close" type="button">Закрыть</button>
    </div>
  </dialog>

  <dialog id="uncheck-dialog" aria-labelledby="uncheck-title">
    <h2 id="uncheck-title"></h2>
    <p class="muted">Также снимутся отметки:</p>
    <ul id="uncheck-list"></ul>
    <div class="toolbar">
      <button id="uncheck-confirm" type="button" class="primary">Снять отметки</button>
      <button id="uncheck-cancel" type="button">Отмена</button>
    </div>
  </dialog>

  <p id="toast" role="status" hidden></p>

  <template id="step-template">
    <li>
      <input type="checkbox">
      <button type="button" class="open">
        <strong class="title"></strong>
        <span class="connector"></span>
      </button>
    </li>
  </template>

  <script type="module" src="src/app.js"></script>
</body>
</html>
