name: Shared boards

on:
  push:
    branches: [main]
    paths: ["shared_boards/**", ".github/workflows/shared-boards.yml"]
  pull_request:
    paths: ["shared_boards/**", ".github/workflows/shared-boards.yml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node shared_boards/scripts/validate.mjs
