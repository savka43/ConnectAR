name: iOS

on:
  push:
    branches: [main]
    paths: ["ios/**", "shared_boards/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", "shared_boards/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & test
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Session tests
        run: sh scripts/test-session.sh

      - name: Build for iOS Simulator
        run: |
          set -o pipefail
          xcodebuild build \
            -project ConnectAR.xcodeproj \
            -target ConnectAR \
            -configuration Debug \
            -sdk iphonesimulator \
            CODE_SIGNING_ALLOWED=NO \
            | xcbeautify --renderer github-actions
